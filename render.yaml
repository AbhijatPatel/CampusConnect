services:
  # 1. Spring Boot Backend Web Service (Render Native Java)
  - type: web
    name: campusconnect-backend
    env: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/campusconnect-backend-1.0.0.jar
    plan: free
    healthCheckPath: /api/jobs
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-ai-service
          property: host
      - key: FRONTEND_URL
        sync: false

  # 2. Python FastAPI AI Microservice (Render Native Python)
  - type: web
    name: campusconnect-ai-service
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: qwen2.5:latest
